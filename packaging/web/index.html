<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>EaglePlot in the browser</title>
    <link rel="icon" href="./eagleplot-icon.png" />
    <link rel="stylesheet" href="./stlite/stlite.css" />
    <style>
      :root { --bg: #1b1b1b; --fg: #f4f4f4; --muted: #b9b9b9; --rose: #e0a3a3; --track: #333; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
      /* Loading splash. Above stlite's own loading skeleton, which is drawn into #root meanwhile. */
      #loading {
        position: fixed; inset: 0; z-index: 100000; overflow: hidden; background: var(--bg);
        display: grid; grid-template-rows: 1fr auto; justify-items: center; text-align: center;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 450ms ease;
      }
      #loading.ep-gone { opacity: 0; pointer-events: none; }
      #loading .ep-center { display: grid; justify-items: center; align-content: center; gap: 10px; padding: 16px; }
      #loading .ep-head { width: min(52vw, 240px); height: auto; overflow: visible; }
      #loading .ep-wordmark { width: min(60vw, 230px); height: auto; opacity: 0; transform: translateY(6px); }
      #loading.ep-landed .ep-wordmark { opacity: 1; transform: none; transition: opacity 500ms ease, transform 500ms ease; }
      #loading .ep-status { display: grid; justify-items: center; gap: 9px; min-height: 76px; }
      #loading .ep-step small { color: var(--muted); margin-left: 8px; font-variant-numeric: tabular-nums; }
      #loading .ep-segs { display: grid; grid-template-columns: repeat(4, 52px); gap: 6px; }
      #loading .ep-segs i { height: 3px; border-radius: 2px; background: var(--track); position: relative; overflow: hidden; }
      #loading .ep-segs i.done { background: var(--rose); }
      #loading .ep-segs i.now::after {
        content: ""; position: absolute; inset: 0; background: var(--rose); transform-origin: left;
        animation: ep-seg 1.6s ease-in-out infinite;
      }
      #loading .ep-note { font-size: 13px; color: var(--muted); max-width: 34rem; }
      #loading .ep-foot { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #8d8d8d; padding: 0 16px 20px; }
      #loading .ep-err { display: grid; gap: 8px; justify-items: center; max-width: 34rem; }
      #loading .ep-err span { color: var(--muted); font-size: 14px; }
      #loading .ep-err button {
        font: 600 14px/1 inherit; background: var(--rose); color: #2a0b10; border: 0; border-radius: 6px;
        padding: 9px 16px; cursor: pointer;
      }
      #loading .ep-pc, #loading .ep-whole, #loading .ep-eyelid { transform-box: fill-box; transform-origin: center; }
      #loading .ep-shine { opacity: 0; }
      #loading.ep-idle .ep-shine { animation: ep-shine 2.8s ease-in-out infinite; }
      #loading.ep-idle .ep-eyelid { animation: ep-blink 3.9s ease-in-out infinite; }
      @keyframes ep-seg { 0% { transform: scaleX(0); opacity: 1; } 70% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
      @keyframes ep-shine { 0% { transform: translateX(-30px); opacity: 0; } 8% { opacity: 1; } 42% { transform: translateX(150px); opacity: 1; } 43%, 100% { transform: translateX(150px); opacity: 0; } }
      @keyframes ep-blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.08); } }
      @media (prefers-reduced-motion: reduce) {
        #loading.ep-idle .ep-shine, #loading.ep-idle .ep-eyelid, #loading .ep-segs i.now::after { animation: none; }
        #loading .ep-segs i.now { background: var(--rose); opacity: 0.6; }
      }
    </style>
  </head>

    <script>
      // Splash controller: window.eaglePlotSplash.setStage(i) / .ready() / .fail(message).
      // A classic script, so the head starts flying before stlite.js is even fetched.
      (function () {
        var el = document.getElementById("loading");
        var STEPS = ["Downloading Python", "Installing the science libraries", "Starting EaglePlot", "Opening your workspace"];
        var EASE = "cubic-bezier(.33,.75,.36,1.12)"; // a slight overshoot; the eye lands exactly
        var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        var stage = -1, landed = false, readyPending = false, done = false;
        var whole = el.querySelector(".ep-whole");
        var seen = false;
        try { seen = localStorage.getItem("eagleplot.started") === "1"; } catch (e) {}
        if (!seen) {
          document.getElementById("ep-note").textContent =
            "First visit: downloading Python and the science libraries (about 45 MB). " +
            "Next time they load from your browser's cache.";
        }

        function render() {
          var segs = "";
          for (var i = 0; i < STEPS.length; i++) segs += '<i class="' + (i < stage ? "done" : i === stage ? "now" : "") + '"></i>';
          var box = document.getElementById("ep-status");
          if (!box.querySelector(".ep-segs")) return; // showing an error
          box.querySelector(".ep-segs").innerHTML = segs;
          document.getElementById("ep-step").innerHTML = STEPS[stage] + "<small>" + (stage + 1) + " of 4</small>";
        }
        function setStage(i) { if (done || i <= stage) return; stage = i; render(); }
        function land() {
          landed = true; el.classList.add("ep-landed");
          if (!reduce) setTimeout(function () { if (!done) el.classList.add("ep-idle"); }, 380);
          if (readyPending) setTimeout(ready, 450);
        }
        function ready() {
          if (done) return;
          if (!landed) { readyPending = true; return; }
          done = true;
          try { localStorage.setItem("eagleplot.started", "1"); } catch (e) {}
          el.classList.remove("ep-idle");
          if (!reduce && whole.animate) {
            whole.animate(
              [{ transform: "none" }, { transform: "translate(-6px, 2px) scale(0.97)", offset: 0.3 }, { transform: "translate(90px, -16px) scale(1.25)" }],
              { duration: 620, easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards" });
          }
          setTimeout(function () { el.classList.add("ep-gone"); }, reduce ? 0 : 200);
          setTimeout(function () { el.remove(); }, reduce ? 460 : 700);
        }
        function fail(message) {
          if (done) return;
          done = true;
          el.classList.remove("ep-idle");
          var box = document.getElementById("ep-status");
          box.innerHTML = '<div class="ep-err"><b>EaglePlot couldn’t start</b><span></span><button type="button">Reload</button></div>';
          box.querySelector("span").textContent = (message ? message + ". " : "") + "Check your connection and reload.";
          box.querySelector("button").addEventListener("click", function () { location.reload(); });
        }

        // Fly-in: each piece starts off-screen at its own offset and spin.
        var pieces = el.querySelectorAll(".ep-pc");
        if (reduce || !whole.animate) {
          land();
        } else {
          var last;
          for (var k = 0; k < pieces.length; k++) {
            var f = pieces[k].getAttribute("data-from").split(" ").map(Number);
            var order = Number(pieces[k].getAttribute("data-order"));
            var anim = pieces[k].animate([
              { transform: "translate(" + f[0] + "px, " + f[1] + "px) rotate(" + f[2] + "deg) scale(" + f[3] + ")", opacity: 0 },
              { opacity: 1, offset: 0.12 },
              { transform: "none", opacity: 1 }
            ], { duration: 950, delay: order * 140, easing: pieces[k].getAttribute("data-ease") || EASE, fill: "backwards" });
            if (order === pieces.length - 1) last = anim;
          }
          last.finished.then(function () {
            whole.animate([{ transform: "scale(1)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 360, easing: "ease-out" });
            land();
          }, land);
        }
        setStage(0);
        window.eaglePlotSplash = {
          setStage: setStage, ready: ready, fail: fail,
          get stage() { return stage; }, // read by scripts/web/smoke.js
        };
      })();
    </script>
    <div id="root"></div>
    <script src="./site-config.js"></script>
    <script type="module">
      import { mount } from "./stlite/stlite.js";

      // Written by packaging/web/build_site.py.
      const cfg = window.EAGLEPLOT_STLITE;
      const abs = (p) => new URL(p, window.location.href).href;

      // Workaround for stlite 1.12 + Streamlit 1.65: app files (/media/…) are served by the
      // Python worker, and stlite routes the usual download path there, but Streamlit's
      // deferred downloads (st.download_button(data=callable)) and its download-URL check
      // use the placeholder origin https://stlite.invalid directly. Unpatched, a deferred
      // download navigates the whole tab to that dead URL and the session is lost. Route
      // both through the worker instead.
      const STLITE_ORIGIN = "https://stlite.invalid/";
      const isWorkerMedia = (url) => url.startsWith(STLITE_ORIGIN) && url.includes("/media/");
      const fromWorker = (url) => {
        const u = new URL(url);
        const path = u.pathname.slice(u.pathname.indexOf("/media/")) + u.search;
        return window.eaglePlotApp._kernel.sendHttpRequest({ method: "GET", path, headers: {}, body: "" });
      };
      const fileName = (disposition) => {
        const star = /filename\*=(?:UTF-8|utf-8)''([^;]+)/.exec(disposition || "");
        if (star) return decodeURIComponent(star[1]);
        const plain = /filename="?([^";]+)"?/.exec(disposition || "");
        return plain ? plain[1] : "";
      };
      const nativeFetch = window.fetch.bind(window);
      window.fetch = async (input, init) => {
        const url = typeof input === "string" ? input : input instanceof URL ? input.href : input.url;
        if (!isWorkerMedia(url)) return nativeFetch(input, init);
        const method = (init?.method || (input instanceof Request ? input.method : "GET")).toUpperCase();
        const res = await fromWorker(url);
        const noBody = method === "HEAD" || [204, 205, 304].includes(res.statusCode);
        return new Response(noBody ? null : res.body, { status: res.statusCode, headers: res.headers });
      };
      const nativeClick = HTMLAnchorElement.prototype.click;
      HTMLAnchorElement.prototype.click = function () {
        if (!isWorkerMedia(this.href)) return nativeClick.call(this);
        fromWorker(this.href).then((res) => {
          if (res.statusCode !== 200) throw new Error(`HTTP ${res.statusCode}`);
          const type = res.headers.get("Content-Type") || "application/octet-stream";
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([res.body], { type }));
          a.download = fileName(res.headers.get("Content-Disposition")) || this.download || "download";
          nativeClick.call(a);
          setTimeout(() => URL.revokeObjectURL(a.href), 60000);
        }).catch((err) => console.error("EaglePlot: download failed", this.href, err));
      };

      const t0 = performance.now();

      // The controller is kept on window so browser tests (scripts/web/smoke.js) can wait
      // for the app and inspect the in-browser file system.
      window.eaglePlotApp = mount(
        {
          entrypoint: cfg.entrypoint,
          archives: [{ url: abs(cfg.appArchive), format: "zip", options: {} }],
          // Binary packages come from the Pyodide distribution; pure-Python ones are
          // bundled with the site as wheels, so nothing is fetched from PyPI at runtime.
          requirements: [...cfg.pyodidePackages, ...cfg.wheels.map(abs)],
          streamlitConfig: cfg.streamlitConfig,
          // Must be pyodide.mjs: stlite's worker is an ES module.
          pyodideUrl: abs(cfg.pyodideUrl),
          // Browser storage (IndexedDB) that survives a reload, for user settings.
          idbfsMountpoints: cfg.idbfsMountpoints,
          env: cfg.env,
          // The splash covers start-up; stlite's own "Loading Pyodide." / "Installing
          // packages." notes would sit on top of it. Error notes stay on.
          disableProgressToasts: true,
        },
        document.getElementById("root"),
      );

      // Splash steps from stlite's kernel events (_kernel is stlite's unstable API: re-check
      // these event names when upgrading @stlite/browser). Progress messages are matched by
      // keyword and steps only move forward, so a reworded message leaves the step as it is.
      const splash = window.eaglePlotSplash;
      const kernel = window.eaglePlotApp._kernel;
      const STEP_PATTERNS = [/pyodide/i, /install|package/i, /streamlit|server|boot/i];
      kernel.addEventListener("loadProgress", (e) => {
        const i = STEP_PATTERNS.findIndex((re) => re.test(String(e.detail)));
        if (i >= 0) splash.setStage(i);
      });
      kernel.addEventListener("loadFinished", () => splash.setStage(3));
      kernel.addEventListener("loadError", (e) => splash.fail(String(e.detail?.message ?? e.detail ?? "")));

      // Hide the splash once the app script has drawn its sidebar. Not on stMain: stlite
      // creates that within ~0.3 s for its own loading messages, ~15 s before the app runs.
      const obs = new MutationObserver(() => {
        if (document.querySelector('[data-testid="stSidebar"]')) {
          splash.ready();
          window.eaglePlotReadyMs = performance.now() - t0;
          obs.disconnect();
        }
      });
      obs.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
