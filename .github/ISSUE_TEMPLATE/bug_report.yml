name: Bug report
description: Something in Plottle doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did (page, button or command), and what happened instead.
      placeholder: On Quick Plot, I selected a scatter plot and clicked a point...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Error message or traceback
      description: Paste the full text if there was one. It is formatted as code automatically.
      render: text
  - type: input
    id: data
    attributes:
      label: Data file type
      description: For example CSV, Excel, JCAMP-DX, or "built-in example dataset".
  - type: input
    id: version
    attributes:
      label: Plottle version
      description: Run `plottle --version` in the environment where Plottle is installed.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: Python 3.11, Windows 11
    validations:
      required: true
