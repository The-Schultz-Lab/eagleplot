name: Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or analysis, and what makes it hard with EaglePlot today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like EaglePlot to do?
      description: Be as specific as you can about the behaviour you'd want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
