version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    # Monthly: each Dependabot PR runs the full 7-cell test matrix.
    schedule:
      interval: "monthly"

    # Group the core scientific stack into one PR to avoid churn
    groups:
      scientific-stack:
        patterns:
          - "numpy"
          - "scipy"
          - "pandas"
          - "matplotlib"
          - "seaborn"
          - "plotly"
      streamlit:
        patterns:
          - "streamlit"
      dev-tools:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "pre-commit"

    # Keep PRs manageable — security updates are handled separately
    open-pull-requests-limit: 5

    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Monthly: each Dependabot PR runs the full 7-cell test matrix.
    schedule:
      interval: "monthly"
    # One PR for all action bumps instead of one per action.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
