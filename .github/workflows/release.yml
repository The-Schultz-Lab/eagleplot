name: Release

# One release pipeline (roadmap D6). Publishing a GitHub Release is the only manual step:
#
#   1. build: build the wheel and sdist from the tagged commit, run
#      scripts/release/check_release.py (tag = v<version>, dated CHANGELOG section, docs
#      badge, wheel contents: G-011, G-012, G-032), and install the wheel in a clean venv.
#   2. pypi: upload to PyPI with Trusted Publishing (OIDC, no token anywhere). Needs the
#      trusted publisher set up on pypi.org once (see RELEASING.md).
#   3. release-files: attach the wheel and sdist to the GitHub Release, and fill in its
#      notes from CHANGELOG.md if they were left empty.
#
# desktop-builds.yml attaches the desktop installers on the same event, and docs.yml has
# already deployed the website when the release PR was merged.
#
# On a pull request that touches packaging, or run by hand (Actions → Release → Run
# workflow), it is a dry run: build and check only.
on:
  release:
    types: [published]
  # Dry run (build and check only) when the packaging or this pipeline changes.
  pull_request:
    paths:
      - "pyproject.toml"
      - "scripts/release/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python scripts/release/check_release.py --dist dist --notes build/release-notes.md \
            ${TAG:+--tag "$TAG"}

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/eagleplot --version
          /tmp/clean/bin/python -I -c "
          import eagleplot, pathlib
          from eagleplot.io import load_data
          root = pathlib.Path(eagleplot.__file__).parent
          data = load_data(str(root / 'example-data' / 'Artificial' / 'sine_cosine_waves.csv'))
          assert data.shape[0] > 0, data.shape
          print('EaglePlot', eagleplot.__version__, 'installed from the wheel and loads data')
          "

      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/
            build/release-notes.md
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/eagleplot/
    permissions:
      id-token: write  # Trusted Publishing: PyPI accepts this job's identity, no token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # A version already on PyPI (e.g. uploaded by hand) is left alone, not an error.
          skip-existing: true

  release-files:
    name: Attach files and notes to the release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist

      - name: Attach the wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

      - name: Fill in empty release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          body=$(gh release view "$TAG" --json body --jq .body)
          if [ -z "${body//[[:space:]]/}" ]; then
            gh release edit "$TAG" --notes-file build/release-notes.md
            echo "Release notes filled in from CHANGELOG.md"
          else
            echo "Release notes already written; left as they are"
          fi
