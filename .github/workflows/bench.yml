name: Benchmark

# Manual only: measures Quick Plot latency in a real browser (roadmap D1.4).
# Numbers vary with runner load, so this reports rather than gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-plot:
    name: Quick Plot latency (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install EaglePlot
        run: pip install -e ".[formats,nist]"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Start the app
        env:
          MPLBACKEND: Agg
        run: |
          nohup streamlit run eagleplot/Home.py --server.headless true --server.port 8501 \
            --browser.gatherUsageStats false > streamlit.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8501 >/dev/null && break; sleep 1; done

      - name: Run benchmarks (warm-up run, then the measured run)
        env:
          OUT: bench-output
        run: |
          mkdir -p "$OUT"
          # The first run after start-up is slow (imports, caches) and may time out; it only
          # warms the server, so its result and exit status are ignored.
          node scripts/bench/st_e2e.js 8501 warmup --live > /dev/null 2>&1 || true
          node scripts/bench/st_e2e.js 8501 quickplot --live | tee "$OUT/quickplot.json"
          node scripts/bench/features.js 8501 | tee "$OUT/features.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Quick Plot latency"
            echo '```json'
            cat bench-output/quickplot.json 2>/dev/null || echo "(no result)"
            echo '```'
            echo "## Feature checks"
            echo '```'
            cat bench-output/features.txt 2>/dev/null || echo "(no result)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -c Traceback streamlit.log || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-output
          path: |
            bench-output/
            streamlit.log
